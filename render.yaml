services:
  - type: web
    name: campus-management-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
